[project]
name = "pipecat-moq-example-client"
version = "0.1.0"
description = "Local /start proxy + web UI for a Pipecat Cloud bot using Media over QUIC"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115,<1",
    "httpx>=0.27,<1",
    "loguru>=0.7,<1",
    "pipecat-ai-prebuilt>=1.0.6",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
